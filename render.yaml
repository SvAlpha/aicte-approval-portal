services:
  - type: web
    name: aicte-approval-portal-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-postgres-db
          property: connectionString

databases:
  - name: aicte-postgres-db
    plan: free
    databaseName: aicte_portal
